name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['*']

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install quality requirements
        # Pinned: lint results should not change because a dependency released.
        run: pip install -r requirements/quality.txt
      - name: Ruff
        run: ruff check openedx_webhook_relay
      - name: isort
        run: isort --check-only --diff openedx_webhook_relay
      - name: Pylint
        run: pylint openedx_webhook_relay
      - name: pre-commit
        # Hook versions are pinned to match quality.txt, so this agrees with the
        # three checks above instead of fighting them.
        run: |
          pip install pre-commit
          pre-commit run --all-files
      - name: Migrations match the models
        # Catches a model change committed without its migration, and the
        # reverse: a migration whose state has drifted from the models.
        env:
          DJANGO_SETTINGS_MODULE: openedx_webhook_relay.tests.settings
          # django-admin does not add the working directory to sys.path (unlike
          # manage.py), and this job does not install the package itself.
          PYTHONPATH: .
        run: |
          pip install -r requirements/test.txt
          django-admin makemigrations openedx_webhook_relay --check --dry-run

  test:
    runs-on: ubuntu-latest
    strategy:
      # Without this a single failing leg cancels the others, so you see one
      # error instead of which combinations actually break.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        django-version: ["4.2", "5.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install requirements
        # Pinned deps first, then override Django for this matrix leg. The reverse
        # order lets the django== pin in test.txt silently upgrade the 4.2 leg
        # to 5.2, so the leg would report green while testing the wrong version.
        run: |
          pip install -r requirements/test.txt
          pip install "Django~=${{ matrix.django-version }}.0"
          pip install -e .
          python -c "import django; print('Django', django.get_version())"
      - name: Run tests with coverage
        run: pytest --cov=openedx_webhook_relay --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.django-version }}
          path: coverage.xml
