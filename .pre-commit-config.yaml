repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  # Hook versions are kept in step with requirements/quality.txt. When they
  # drift, pre-commit reformats files that CI accepts (or the reverse) and
  # developers end up fighting the pipeline.
  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      # `ruff` became a legacy alias in 0.16; the hook is now `ruff-check`.
      - id: ruff-check
        args: [--fix]

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        # Same scope as CI (`pylint openedx_webhook_relay`). Without this,
        # pre-commit also lints setup.py and scripts/, which CI never checks —
        # so the hook would fail on findings the pipeline is fine with.
        files: '^openedx_webhook_relay/'
        exclude: 'migrations/'
