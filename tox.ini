[tox]
envlist = py311-django{42,52}, quality
skipsdist = true

[testenv]
# Pinned deps, then Django overridden per matrix leg in commands_pre. It has to
# happen in two steps: tox hands every `deps` entry to a single pip invocation,
# so listing a Django range here alongside the `django==` pin in test.txt would
# be an unresolvable conflict.
deps = -r requirements/test.txt
commands_pre =
    django42: pip install "Django>=4.2,<4.3"
    django52: pip install "Django>=5.2,<5.3"
    python -c "import django; print('Django', django.get_version())"
commands =
    pytest --cov=openedx_webhook_relay --cov-report=term-missing --cov-fail-under=90

[testenv:quality]
deps = -r requirements/quality.txt
commands =
    ruff check openedx_webhook_relay
    isort --check-only --diff openedx_webhook_relay
    pylint openedx_webhook_relay
