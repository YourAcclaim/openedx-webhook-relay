# Ruff configuration.
#
# Kept in sync with the conventions already declared for the other quality
# tools: line length 100 and migrations excluded (see [isort] in setup.cfg
# and max-line-length/ignore in .pylintrc).

line-length = 100
target-version = "py311"

# Generated by Django; not hand-maintained, so not linted. Matches
# `skip = migrations` (isort) and `ignore=migrations` (pylint).
extend-exclude = ["*/migrations/*"]

[lint]
ignore = [
    # Django's declarative style relies on mutable class attributes
    # (admin list_display/fieldsets, Meta.fields, AppConfig dicts).
    # Requiring ClassVar on each adds noise without catching real bugs.
    "RUF012",
    # The remaining `noqa` directives name rules from rulesets that are not
    # enabled here (S105 on test-only fake secrets, N803 on boto3's
    # PascalCase kwargs). They document intent for when those rulesets are
    # turned on, so they are kept rather than stripped as unused.
    "RUF100",
]
